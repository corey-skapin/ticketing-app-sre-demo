name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Test
        working-directory: app
        run: npm test
      - name: Check
        working-directory: app
        run: npm run check
      - name: Package
        working-directory: app
        run: npm run package
